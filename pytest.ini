[pytest]
minversion = 8.0
testpaths = tests/test
addopts =
    -ra
    --strict-markers
    --alluredir=target/allure-results
    --clean-alluredir
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    e2e: end-to-end UI test through the real app
    p0: highest-priority / release-blocking scenario
    p1: important, non-blocking scenario
    p2: low-priority / nice-to-have scenario
    android: Android-specific test
    ios: iOS-specific test
    manual_otp: requires manually entering an OTP — exclude from CI
    ignore: excluded from default runs
