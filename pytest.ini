[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -s
    --alluredir=target/allure-results
    --clean-alluredir
    -ra
    --reruns 1
    --reruns-delay 2
filterwarnings =
    ignore::pytest.PytestUnknownMarkWarning
markers =
    flaky: Optional per-test extra retries (pytest-rerunfailures)
    e2e: End-to-end UI tests (required on every UI test)
    p0: Priority 0 — smoke / critical path
    p1: Priority 1 — high value regression
    p2: Priority 2 — lower priority coverage
    android: Run on Android only
    ios: Run on iOS only
    ignore: Excluded from default test runs
    auth_profile: Credential / session profile for Appium session reuse
    authenticated: Ensure logged-in home before the test (isolation; no login-first order)
    fresh: Test owns clean app setup (e.g. login with pm clear)
    # Feature markers (login, groups, payments, …) need not be listed —
    # --strict-markers is off so any @pytest.mark.<name> is accepted at runtime.
