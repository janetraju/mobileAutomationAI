[project]
name = "mobile-automation"
version = "0.1.0"
description = "App-agnostic Pytest + Appium + Allure mobile UI automation framework"
requires-python = ">=3.10"
dependencies = [
    "Appium-Python-Client>=4.1.0",
    "selenium>=4.20.0",
    "pytest>=8.0.0",
    "pytest-xdist>=3.5.0",
    "allure-pytest>=2.13.5",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "invoke>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "black>=24.4.0",
    "pre-commit>=3.7.0",
    "androguard>=4.1.0",  # invoke app:analyze — APK package/activity/type extraction
]

[tool.setuptools.packages.find]
include = ["src*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 100
target-version = ["py310"]
